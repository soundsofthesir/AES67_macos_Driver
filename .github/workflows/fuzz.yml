name: Fuzz

# Open-ended fuzzing of the parsers that read untrusted input: PTP, SAP, SDP,
# RTSP, streams.json, ptp.json and the JSON parser under them. PRs only replay
# the committed corpus (ci.yml); this explores new inputs, so a failure here is
# a newly found bug rather than something the triggering commit did.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target (with one worker per core)
        default: "300"

permissions:
  contents: read
  issues: write # open one issue when the nightly run finds a crash

# No cancel-in-progress: a nightly run is the only record of what it found
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libuuid headers
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      # libFuzzer writes every input that reaches new coverage to
      # build-fuzz/corpus/<target>. Restoring yesterday's corpus means each
      # night starts where the last one stopped instead of from the seeds.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        run: Tests/Fuzz/run-fuzzers.sh "${{ github.event.inputs.seconds || '300' }}" build-fuzz

      # run_id makes the key unique; restore-keys above find it next time.
      # The 7-day cache eviction is kept alive by the nightly access.
      - name: Save corpus
        if: always() && hashFiles('build-fuzz/corpus/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      # A crashing input reproduces with build-fuzz/<Target> <file>. Once it is
      # fixed, commit the input to Tests/Fuzz/corpus/<target>/.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: build-fuzz/crashes/
          if-no-files-found: ignore
          retention-days: 30

      # The inputs worth committing: coverage the nightly reached that the
      # repository's corpus does not have yet
      - name: Upload new corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: build-fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 30

      - name: Open an issue on a nightly crash
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Nightly fuzzing found a crash"
          open="$(gh issue list --state open --search "$title in:title" --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "Issue already open; adding this run to it is left to the triager."
            exit 0
          fi
          {
            echo "The nightly fuzzer run on ${GITHUB_SHA} failed."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Crashes (also uploaded as the \`fuzz-crashes\` artifact):"
            echo '```'
            ls -1 build-fuzz/crashes/ 2>/dev/null || echo "no artifact: the failure was in the build"
            echo '```'
            echo
            echo "Reproduce with \`build-fuzz/<Target> <file>\`; once fixed, commit the input to \`Tests/Fuzz/corpus/<target>/\`."
          } > issue.md
          gh issue create --title "$title" --body-file issue.md
